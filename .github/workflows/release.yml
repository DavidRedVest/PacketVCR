name: Release

# Runs on every push/PR (build-only, for CI validation) and, when a tag
# matching v*.*.* is pushed, additionally publishes a GitHub Release.
#
# The three platforms are built on their own native runner (Windows can't
# produce a macOS/Linux binary and vice versa), but the "package" job below
# merges all three outputs into a single downloadable folder:
#   PacketVCR/
#     windows/   PacketVCR.exe, recorder_cli.exe, player_cli.exe, Qt DLLs
#     macos/     PacketVCR.app, recorder_cli, player_cli
#     linux/     PacketVCR, recorder_cli, player_cli, bundled .so libs
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage binaries
        run: cmake --install build --config Release --prefix dist

      - name: Bundle Qt runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: windeployqt --release dist\PacketVCR.exe

      - name: Bundle Qt runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: macdeployqt dist/PacketVCR.app

      - name: Bundle Qt runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage" -O linuxdeployqt.AppImage
          chmod +x linuxdeployqt.AppImage
          # Extract instead of running the AppImage directly: CI runners don't have FUSE.
          ./linuxdeployqt.AppImage --appimage-extract
          ./squashfs-root/AppRun dist/PacketVCR -bundle-non-qt-libs -no-translations

      - name: Ensure executables are marked executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x dist/PacketVCR.app/Contents/MacOS/PacketVCR 2>/dev/null || true
          chmod +x dist/PacketVCR 2>/dev/null || true
          chmod +x dist/recorder_cli dist/player_cli

      # Upload the raw staged folder (no zipping here) -- the "package" job
      # below merges all three platforms' folders into one download.
      - name: Upload platform folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # No `name:` given -> downloads every artifact, each into its own
      # subfolder named after the artifact (windows/macos/linux). This is
      # exactly the "one folder, one subfolder per platform" layout.
      - name: Download all platform folders
        uses: actions/download-artifact@v4
        with:
          path: PacketVCR

      - name: Re-apply executable permissions
        run: |
          find PacketVCR -type f \( -name "PacketVCR" -o -name "recorder_cli" -o -name "player_cli" \) -exec chmod +x {} +
          find PacketVCR -path "*/PacketVCR.app/Contents/MacOS/PacketVCR" -exec chmod +x {} +

      - name: List contents
        run: find PacketVCR -maxdepth 2

      - name: Zip combined package
        run: (cd PacketVCR && zip -r ../PacketVCR.zip .)

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketVCR-all-platforms
          path: PacketVCR.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PacketVCR-all-platforms

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PacketVCR.zip
          draft: false
          generate_release_notes: true
