name: Release

# Runs on every push/PR (build-only, for CI validation) and, when a tag
# matching v*.*.* is pushed, additionally publishes a GitHub Release with a
# packaged, ready-to-run archive for each platform.
on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Stage binaries
        run: cmake --install build --config Release --prefix dist

      - name: Bundle Qt runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: windeployqt --release dist\bin\PacketVCR.exe

      - name: Bundle Qt runtime (macOS)
        if: matrix.os == 'macos-latest'
        run: macdeployqt dist/PacketVCR.app

      - name: Bundle Qt runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage" -O linuxdeployqt.AppImage
          chmod +x linuxdeployqt.AppImage
          # Extract instead of running the AppImage directly: CI runners don't have FUSE.
          ./linuxdeployqt.AppImage --appimage-extract
          ./squashfs-root/AppRun dist/bin/PacketVCR -bundle-non-qt-libs -no-translations

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath PacketVCR-windows.zip

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: (cd dist && zip -r ../PacketVCR-macos.zip .)

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: (cd dist && tar -czf ../PacketVCR-linux.tar.gz .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketVCR-${{ matrix.name }}
          path: PacketVCR-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
